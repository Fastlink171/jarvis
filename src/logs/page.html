<title>Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Logs: a Planner log (what you mean to do) linked to the Log (what actually happened).
   Planned items arrive in the Log as Pending until you confirm them, adjust their times, or skip them.
   Push tasks are timed live: push to start, push again to finish — they land in the Log already verified. */
:root{
  color-scheme:dark;
  --ink:#f7f3ff; --dim:rgba(238,232,255,.74); --faint:rgba(238,232,255,.48);
  --glass:rgba(28,20,58,.50); --glass2:rgba(36,26,72,.62); --line:rgba(230,220,255,.16); --line2:rgba(230,220,255,.28);
  --lav:#c8b6ff; --pink:#ffb3d6; --sun:#ffd38a; --sky:#9fd2ff;
  --pend:#ffcf6e; --pend-bg:rgba(255,207,110,.14); --ok:#8ff0c2; --ok-bg:rgba(143,240,194,.14); --skip:#b9b2cc; --skip-bg:rgba(185,178,204,.12); --live:#ff8fb8;
  --display:'Cormorant Garamond',Georgia,serif; --body:Inter,'Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:14px;background:radial-gradient(120% 90% at 70% 10%,#5b4aa8 0%,#2a1f55 45%,#160f30 100%) fixed;
  padding:14px max(16px,env(safe-area-inset-left,0px)) 24px}
html.scene body{background:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1500px;margin:0 auto;display:grid;gap:12px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px) saturate(1.15);backdrop-filter:blur(10px) saturate(1.15);box-shadow:0 10px 30px rgba(10,6,30,.35),inset 0 1px 0 rgba(255,255,255,.08)}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em;text-shadow:0 2px 18px rgba(255,200,230,.35)}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .d{font-family:var(--display);font-size:20px;font-weight:600;min-width:170px;text-align:center}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--glass2);display:grid;place-items:center}
.ib:hover{border-color:var(--lav)}
.pill{padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--glass2);font-size:12px;font-weight:600}
.pill:hover{border-color:var(--lav)}
.seg{display:inline-flex;background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;font-size:13px;color:var(--dim)}
.seg button.on{background:linear-gradient(135deg,rgba(200,182,255,.35),rgba(255,179,214,.3));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sum{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.chip b{font-weight:600;color:#fff}
.chip.p b{color:var(--pend)} .chip.v b{color:var(--ok)}
.close{display:none}
.in-app .close{display:inline-flex}
.saved{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--faint)}
.saved b{color:var(--sun);font-weight:600}

.main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
.card{padding:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ch h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700}
.ch span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--sun)}
.note{font-size:12px;color:var(--faint);line-height:1.5;margin:0}

/* push */
.live{border-radius:12px;padding:12px;margin-bottom:10px;background:linear-gradient(135deg,rgba(255,143,184,.22),rgba(200,182,255,.16));border:1px solid rgba(255,143,184,.45)}
.live .t{font-weight:700;font-size:15px}
.live .clk{font-family:var(--mono);font-size:26px;font-weight:600;margin:4px 0 8px;letter-spacing:.04em}
.live .since{font-size:11px;color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;background:linear-gradient(135deg,#ffd38a,#ffb3d6);color:#2a1440}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line2);font-weight:600}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.ptasks{display:grid;gap:6px}
.pt{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:7px 8px 7px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.pt.on{border-color:rgba(255,143,184,.6);background:rgba(255,143,184,.10)}
.pt .n{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .x{border:0;background:none;color:var(--faint);font-size:14px;padding:2px 6px}
.pt .x:hover{color:#fff}
.row{display:flex;gap:6px;margin-top:8px}
.fld{flex:1;min-width:0;padding:8px 11px;border-radius:10px;border:1px solid var(--line2);background:rgba(10,6,28,.35);outline:none}
.fld:focus{border-color:var(--lav);box-shadow:0 0 0 3px rgba(200,182,255,.18)}
.fld::placeholder{color:var(--faint)}
.tfld{width:96px;flex:none}

/* planner */
.paste{width:100%;min-height:118px;resize:vertical;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(10,6,28,.35);outline:none;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.paste:focus{border-color:var(--lav)}
.preview{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin:8px 0 0;display:grid;gap:3px}
.preview .bad{color:#ff9db8}
.items{display:grid;gap:8px}
.it{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.035);position:relative}
.it::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--pend)}
.it.verified::before{background:var(--ok)} .it.skipped::before{background:var(--skip)} .it.live::before{background:var(--live);box-shadow:0 0 8px var(--live)}
.it .tm{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.5}
.it .tm b{color:#fff;font-weight:600}
.it .tl{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.it .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.it.skipped .tl{color:var(--skip);text-decoration:line-through;text-decoration-color:rgba(185,178,204,.5)}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 8px;border-radius:999px;font-weight:600;text-transform:uppercase;white-space:nowrap}
.badge.pending{color:var(--pend);background:var(--pend-bg)} .badge.verified{color:var(--ok);background:var(--ok-bg)} .badge.skipped{color:var(--skip);background:var(--skip-bg)} .badge.live{color:var(--live);background:rgba(255,143,184,.15)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.adj{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line);margin-top:2px}
.adj label{font-size:12px;color:var(--dim)}
.grp{margin:16px 0 8px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.grp:first-child{margin-top:0}
.grp i{flex:1;height:1px;background:var(--line)}
.empty{padding:22px;text-align:center;color:var(--faint);font-size:13px;border:1px dashed var(--line2);border-radius:12px}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:4px}
.totals{display:grid;gap:6px}
.tot{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px}
.bar{grid-column:1/-1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--pink))}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:rgba(28,20,58,.92);border:1px solid var(--line2);font-size:13px;z-index:9;display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:var(--sun);font-weight:700}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.it{grid-template-columns:minmax(0,1fr)}.acts{justify-content:flex-start}.sum{margin-left:0}}

/* intro (played when the app opens the Logs) */
.intro .top,.intro .main>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.intro .main>*:nth-child(2){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* scene behind the logs (the user's own layered picture) */
#lgScene{display:none}
html.scene #lgScene{display:block;position:fixed;inset:0;z-index:-1;overflow:hidden;perspective:1800px;background:#2a1f55}
#lgStage{position:absolute;left:50%;top:50%;transform-origin:50% 50%;will-change:transform}
#lgStage img{position:absolute;display:block;will-change:transform;pointer-events:none;user-select:none}
#lgScene .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(16,10,40,.62) 0,rgba(16,10,40,.22) 26%,rgba(16,10,40,.10) 50%,rgba(16,10,40,.22) 74%,rgba(16,10,40,.55) 100%),linear-gradient(180deg,rgba(16,10,40,.45) 0,rgba(16,10,40,.08) 24%,rgba(16,10,40,.18) 70%,rgba(16,10,40,.55) 100%)}
#lgScene canvas{position:absolute;inset:0;pointer-events:none}
</style>

<div id="lgScene" aria-hidden="true"><div id="lgStage"></div><canvas></canvas><div class="shade"></div></div>
<div class="wrap">
  <header class="top">
    <h1>Logs</h1>
    <div class="datenav"><button class="ib" id="prev" aria-label="Previous day">‹</button><div class="d" id="dlabel"></div><button class="ib" id="next" aria-label="Next day">›</button><button class="pill" id="today">Today</button></div>
    <div class="seg" role="tablist"><button id="tabPlan" class="on" role="tab">Planner</button><button id="tabLog" role="tab">Log</button></div>
    <div class="sum" id="sum"></div>
    <span class="saved" id="saved"></span>
    <button class="pill close" id="closeBtn" title="Close (Esc)">Close ✕</button>
  </header>

  <div class="main">
    <aside style="display:grid;gap:12px">
      <section class="glass card">
        <div class="ch"><h2>Push tasks</h2><span>LIVE TIMER</span></div>
        <div id="liveBox"></div>
        <div class="ptasks" id="ptasks"></div>
        <form class="row" id="ptForm"><input class="fld" id="ptIn" placeholder="Add a task to push… e.g. Cx" autocomplete="off"><button class="btn sm">Add</button></form>
        <p class="note" style="margin-top:8px">Press <b>Push</b> when you start. Press it again when you're done and it's logged with the real times, already verified.</p>
      </section>
      <section class="glass card">
        <div class="ch"><h2>Time logged</h2><span id="totRange">THIS DAY</span></div>
        <div class="totals" id="totals"></div>
      </section>
    </aside>

    <section class="glass card" id="board"></section>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return ymd(d); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const mins = hm => { if (!hm) return null; const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const fmt12 = hm => { if (!hm) return '—'; let [h, m] = hm.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(m) + ' ' + ap; };
const durMin = (a, b) => { if (!a || !b) return 0; let d = mins(b) - mins(a); if (d < 0) d += 1440; return d; };
const fmtDur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- storage: the app keeps the data (file on the PC); the stand-alone page uses this browser */
const IN_FRAME = window.parent !== window;
let HOST = null, data = { plans: [], logs: [], pushTasks: [], active: null };
const findHost = () => { try { return window.parent.jarvisLogs || null; } catch { return null; } };
function norm(d){ d = d && typeof d === 'object' ? d : {}; return { plans: d.plans || [], logs: d.logs || [], pushTasks: d.pushTasks || [], active: d.active || null }; }
function save(){
  if (HOST) { HOST.set(data); setSaved('Saved to ' + (HOST.name ? HOST.name() : 'the app')); }
  else { try { localStorage.setItem('logs.v1', JSON.stringify(data)); } catch {} setSaved('Saved in this browser'); }
}
function setSaved(t){ $('#saved').innerHTML = ''; $('#saved').append(t.replace(/\s\S+$/, ' '), el('b', null, t.split(' ').pop())); }

/* ---------- the model: every plan has a linked log; push tasks write verified logs */
let day = today(), tab = 'plan', openAdj = null;
const plansOn = d => data.plans.filter(p => p.date === d).sort((a, b) => (mins(a.start) ?? 9999) - (mins(b.start) ?? 9999));
const logsOn = d => data.logs.filter(l => l.date === d);
const logFor = p => data.logs.find(l => l.planId === p.id);
function addPlan(title, start, end, date = day){
  const p = { id: uid(), date, title: title.trim(), start, end };
  const l = { id: uid(), date, title: p.title, planId: p.id, plannedStart: start, plannedEnd: end, start: null, end: null, status: 'pending', source: 'plan' };
  data.plans.push(p); data.logs.push(l); return p;
}
function delPlan(p){
  const l = logFor(p);
  data.plans = data.plans.filter(x => x !== p);
  if (l && l.status !== 'verified') data.logs = data.logs.filter(x => x !== l); else if (l) l.planId = null;
}
function verify(l, start, end){ l.start = start || l.plannedStart; l.end = end || l.plannedEnd; l.status = 'verified'; l.verifiedAt = Date.now(); }
function skip(l){ l.status = 'skipped'; l.start = l.end = null; }
function unverify(l){ l.status = 'pending'; l.start = l.end = null; }

/* push: start a timer; pushing again finishes it straight into the log (already verified) */
function push(title){
  title = String(title || '').trim(); if (!title) return null;
  const a = data.active;
  if (a && a.title.toLowerCase() === title.toLowerCase()) return finish();
  if (a) finish();
  const start = nowHM(), d = today();
  const p = { id: uid(), date: d, title, start, end: null, pushed: true };
  data.plans.push(p);
  data.active = { title, planId: p.id, startedAt: Date.now(), start, date: d };
  if (!data.pushTasks.some(t => t.title.toLowerCase() === title.toLowerCase())) data.pushTasks.push({ id: uid(), title });
  save(); render(); toast(`Started ${title} at ${fmt12(start)}`);
  return { started: title, at: start };
}
function finish(){
  const a = data.active; if (!a) return null;
  const end = nowHM(), p = data.plans.find(x => x.id === a.planId);
  if (p) p.end = end;
  data.logs.push({ id: uid(), date: a.date, title: a.title, planId: a.planId, plannedStart: a.start, plannedEnd: end, start: a.start, end, status: 'verified', source: 'push', verifiedAt: Date.now() });
  data.active = null; save(); render();
  const m = Math.max(1, Math.round((Date.now() - a.startedAt) / 60000));
  toast(`Logged ${a.title}: ${fmt12(a.start)} – ${fmt12(end)} (${fmtDur(m)})`);
  return { finished: a.title, from: a.start, to: end, minutes: m };
}

/* ---------- paste a plan:  "Meme Rush TD:  9:00 AM - 12:00 PM"  (colon, tabs or spaces) */
const TIME = '(\\d{1,2}(?::\\d{2})?\\s*(?:a\\.?m\\.?|p\\.?m\\.?)?)';
const LINE = new RegExp('^\\s*(.+?)[\\s:–-]*' + TIME + '\\s*(?:-|–|—|to)\\s*' + TIME + '\\s*$', 'i');
function to24(t, fallbackAP){
  const m = String(t).trim().toLowerCase().replace(/\./g, '').match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/); if (!m) return null;
  let h = +m[1], mi = +(m[2] || 0); const ap = m[3] || fallbackAP;
  if (h > 23 || mi > 59) return null;
  if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0;
  return pad(h) + ':' + pad(mi);
}
function parsePlan(text){
  return text.split(/\r?\n/).map(s => s.trim()).filter(Boolean).map(line => {
    const m = line.match(LINE); if (!m) return { line, bad: true };
    const apOf = s => (s.toLowerCase().replace(/\./g, '').match(/(am|pm)/) || [])[1];
    const a1 = apOf(m[2]), a2 = apOf(m[3]);
    const start = to24(m[2], a1 || a2), end = to24(m[3], a2 || a1);
    const title = m[1].replace(/[:\s–-]+$/, '').trim();
    if (!title || !start || !end) return { line, bad: true };
    return { title, start, end };
  });
}

/* ---------- render */
function render(){
  const d = new Date(day + 'T12:00');
  $('#dlabel').textContent = day === today() ? 'Today · ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' }) : d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  $('#tabPlan').classList.toggle('on', tab === 'plan'); $('#tabLog').classList.toggle('on', tab === 'log');
  const L = logsOn(day), pend = L.filter(l => l.status === 'pending').length, ver = L.filter(l => l.status === 'verified');
  const planned = plansOn(day).reduce((a, p) => a + durMin(p.start, p.end), 0), logged = ver.reduce((a, l) => a + durMin(l.start, l.end), 0);
  const sum = $('#sum'); sum.innerHTML = '';
  const chip = (cls, k, v) => { const c = el('span', 'chip ' + cls); c.append(k + ' ', el('b', null, v)); sum.append(c); };
  chip('', 'PLANNED', fmtDur(planned)); chip('v', 'LOGGED', fmtDur(logged)); chip('p', 'PENDING', String(pend));
  renderPush(); renderTotals(); tab === 'plan' ? renderPlanner() : renderLog();
}
function renderPush(){
  const box = $('#liveBox'); box.innerHTML = '';
  const a = data.active;
  if (a) {
    const c = el('div', 'live'); const t = el('div', 't'); t.append(el('span', 'dot'), a.title);
    const clk = el('div', 'clk', '0:00:00'); clk.id = 'liveClk';
    const since = el('div', 'since', 'Started ' + fmt12(a.start) + (a.date !== today() ? ' (' + a.date + ')' : ''));
    const b = el('button', 'btn', 'Push to finish'); b.onclick = () => finish();
    c.append(t, clk, since, b); box.append(c); tickClock();
  }
  const list = $('#ptasks'); list.innerHTML = '';
  if (!data.pushTasks.length) list.append(el('p', 'note', 'No push tasks yet. Add the things you work on, then push one when you start.'));
  data.pushTasks.forEach(task => {
    const on = a && a.title.toLowerCase() === task.title.toLowerCase();
    const r = el('div', 'pt' + (on ? ' on' : '')); r.append(el('span', 'n', task.title));
    const b = el('button', on ? 'btn sm' : 'btn ghost sm', on ? 'Finish' : 'Push'); b.onclick = () => push(task.title);
    const x = el('button', 'x', '✕'); x.title = 'Remove from push tasks'; x.onclick = () => { data.pushTasks = data.pushTasks.filter(t => t !== task); save(); render(); };
    r.append(b, x); list.append(r);
  });
}
function tickClock(){ const c = $('#liveClk'), a = data.active; if (!c || !a) return; const s = Math.floor((Date.now() - a.startedAt) / 1000); c.textContent = Math.floor(s / 3600) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); }
setInterval(tickClock, 1000);
function renderTotals(){
  const box = $('#totals'); box.innerHTML = '';
  const by = {}; logsOn(day).filter(l => l.status === 'verified').forEach(l => { by[l.title] = (by[l.title] || 0) + durMin(l.start, l.end); });
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]), max = rows.length ? rows[0][1] : 1;
  if (!rows.length) { box.append(el('p', 'note', 'Nothing verified yet for this day.')); return; }
  rows.forEach(([t, m]) => { const r = el('div', 'tot'); r.append(el('span', null, t), el('b', null, fmtDur(m))); const bar = el('div', 'bar'), i = el('i'); i.style.width = Math.max(4, m / max * 100) + '%'; bar.append(i); r.append(bar); box.append(r); });
}
function statusOf(p){
  if (data.active && data.active.planId === p.id) return 'live';
  const l = logFor(p); return l ? l.status : (p.pushed && p.end ? 'verified' : 'pending');
}
function itemRow(p, l, mode){

  else { tm.append(el('b', null, fmt12(l.plannedStart)), document.createElement('br'), (l.plannedEnd ? fmt12(l.plannedEnd) : '…')); }
  const mid = el('div'); mid.append(el('div', 'tl', mode === 'plan' ? p.title : l.title));
  const sub = el('div', 'sub');

  else if (st === 'verified') sub.textContent = (l && l.source === 'push' ? 'Pushed · ' : 'Verified · ') + fmtDur(durMin(l ? l.start : p.start, l ? l.end : p.end));

  else if (st === 'pending') sub.textContent = 'Planned · ' + fmtDur(durMin(p ? p.start : l.plannedStart, p ? p.end : l.plannedEnd)) + ' · waiting for you to confirm';

    const ok = el('button', 'btn sm', '✓ Done as planned'); ok.onclick = () => { verify(L); save(); render(); };
    const adj = el('button', 'btn ghost sm', 'Adjust times'); adj.onclick = () => { openAdj = openAdj === L.id ? null : L.id; render(); };
    const sk = el('button', 'btn ghost sm', 'Skip'); sk.onclick = () => { skip(L); save(); render(); };

  r.append(tm, mid, acts);

function renderPlanner(){

  const row = el('div', 'row'); const add = el('button', 'btn', 'Add to planner'); add.disabled = true;

function renderLog(){
  const b = $('#board'); b.innerHTML = '';
  const ch = el('div', 'ch'); ch.append(el('h2', null, 'Log'), el('span', null, 'WHAT ACTUALLY HAPPENED')); b.append(ch);
  const L = logsOn(day).slice().sort((x, y) => (mins(x.start || x.plannedStart) ?? 9999) - (mins(y.start || y.plannedStart) ?? 9999));
  const live = data.active && data.active.date === day ? [data.active] : [];
  const groups = [['Live now', []], ['Pending', L.filter(l => l.status === 'pending')], ['Verified', L.filter(l => l.status === 'verified')], ['Skipped', L.filter(l => l.status === 'skipped')]];
  if (!L.length && !live.length) { const e = el('div', 'empty'); e.append(el('b', null, 'No logs for this day'), 'Plans you add show up here as Pending, and finished pushes land here verified.'); b.append(e); return; }
  if (live.length) { const g = el('div', 'grp'); g.append('Live now', el('i')); b.append(g); const p = data.plans.find(x => x.id === data.active.planId); if (p) b.append(itemRow(p, null, 'plan')); }
  groups.slice(1).forEach(([name, list]) => {
    if (!list.length) return;
    const g = el('div', 'grp'); g.append(name + ' · ' + list.length, el('i')); b.append(g);
    const items = el('div', 'items'); list.forEach(l => items.append(itemRow(data.plans.find(p => p.id === l.planId) || null, l, 'log'))); b.append(items);
  });
}
let toastT = 0;
function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el('div', 'toast'); t.append(el('span', null, msg));
  if (undo) { const u = el('button', null, 'Undo'); u.onclick = () => { undo(); t.remove(); }; t.append(u); }
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4000);
}

(async function boot(){
  if (IN_FRAME) document.documentElement.classList.add('in-app');
  for (let i = 0; IN_FRAME && !HOST && i < 50; i++) { HOST = findHost(); if (!HOST) await new Promise(r => setTimeout(r, 100)); }
  if (HOST) {
    data = norm(HOST.get());
    HOST.subscribe(d => { data = norm(d); render(); });
    setSaved('Saved to ' + (HOST.name ? HOST.name() : 'the app'));
    if (HOST.scene) HOST.scene().then(u => u && loadScene(u)).catch(() => {});

    try { data = norm(JSON.parse(localStorage.getItem('logs.v1') || 'null')); } catch {}

/* ---------- the layered scene: camera follows the mouse */
async function loadScene(url){
  let sc; try { sc = await (await fetch(url)).json(); } catch { return; }
  if (!sc || !sc.layers || !sc.layers.length) return;
  document.documentElement.classList.add('scene');
  const stage = $('#lgStage'), els = []; stage.innerHTML = '';
  stage.style.width = sc.W + 'px'; stage.style.height = sc.H + 'px';
  const base = url.replace(/[^/]*$/, '');
  sc.layers.slice().sort((a, b) => a.z - b.z).forEach((l, i) => {
    const im = new Image(); im.alt = ''; im.decoding = 'async'; im.src = l.file ? base + encodeURIComponent(l.file) : l.src;
    Object.assign(im.style, { left: l.x + 'px', top: l.y + 'px', width: l.w + 'px', height: l.h + 'px', zIndex: l.z });
    stage.append(im);
    els.push({ el: im, d: l.depth, idle: l.bg ? 0 : /girl|char|person/i.test(l.name || '') ? 1.3 : .8, ph: i * 1.9, sp: .4 + (i % 4) * .1 });

  let tx = 0, ty = 0, cx = 0, cy = 0, last = performance.now();
  addEventListener('pointermove', e => { tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; }, { passive: true });
  document.addEventListener('pointerleave', () => { tx = ty = 0; });

  (function frame(now){
    requestAnimationFrame(frame); if (document.hidden) { last = now; return; }
    const dt = Math.min(.05, (now - last) / 1000); last = now; const k = 1 - Math.exp(-dt * 4.2);
    cx += (tx - cx) * k; cy += (ty - cy) * k; const m = reduce ? 0 : amt(), t = now / 1000;
    stage.style.transform = `translate(-50%,-50%) scale(${scale}) rotateY(${cx * 1.3 * m}deg) rotateX(${-cy * .9 * m}deg)`;
    for (const L of els) { const bob = m ? Math.sin(t * L.sp + L.ph) * L.idle : 0, sway = m ? Math.cos(t * L.sp * .8 + L.ph) * L.idle * .5 : 0;
      L.el.style.transform = `translate3d(${(-cx * 34 * L.d * m + sway).toFixed(2)}px,${(-cy * 22 * L.d * m + bob).toFixed(2)}px,0)`; }
  })(last);

  const sz = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ps = Array.from({ length: Math.round(innerWidth / 26) }, () => ({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.6, v: .002 + Math.random() * .006, p: Math.random() * 6, petal: Math.random() < .25 })); };
  sz(); addEventListener('resize', sz);
  (function draw(now){
    requestAnimationFrame(draw); if (document.hidden) return;
    const w = cv.width, h = cv.height, t = now / 1000; x.clearRect(0, 0, w, h);
    for (const q of ps) {
      if (!reduce) { q.y -= q.v / 60; q.x += (q.petal ? .00035 : .0001) * Math.sin(t * .6 + q.p); if (q.y < -.03) { q.y = 1.03; q.x = Math.random(); } }
      const px = (q.x - cx * .012 * amt()) * w, py = (q.y - cy * .008 * amt()) * h, a = .25 + .45 * Math.sin(t * .9 + q.p) ** 2;
      if (q.petal) { x.save(); x.translate(px, py); x.rotate(t * .7 + q.p); x.fillStyle = `rgba(255,236,170,${a * .8})`; x.beginPath(); x.ellipse(0, 0, 4.5 * devicePixelRatio, 2.2 * devicePixelRatio, 0, 0, 7); x.fill(); x.restore(); }

}
