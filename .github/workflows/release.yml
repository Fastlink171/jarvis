name: Build and release Jarvis

# Runs on every push to main. If package.json has a version that hasn't been
# released yet, it builds the Windows installer on GitHub's Windows machines and
# publishes it as a release. Installed copies of Jarvis then update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Is this version new?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VER is already released - nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VER"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.ver.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.ver.outputs.new == 'true'
        run: npm ci

      - if: steps.ver.outputs.new == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run release 2>&1 | tee build.log || {
            # surface the end of the log as annotations so it can be read without downloading logs
            tail -n 60 build.log | grep -v '^\s*$' | tail -n 45 > tail.txt
            split -l 15 tail.txt part_
            for f in part_*; do msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f"); echo "::error title=build log::$msg"; done
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
