name: Check on Windows

# Quick checks on GitHub's Windows machines for any branch other than main.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: PC-control helper self-test
        shell: pwsh
        run: |
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/helper.ps1 -SelfTest 2>&1 | Out-String
          Write-Host $out
          $msg = ($out -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
          if ($out -notmatch 'SELFTEST OK') { Write-Host "::error title=helper::$msg"; exit 1 } else { Write-Host "::notice title=helper::$msg" }
      - name: Helper round-trip over stdin
        shell: pwsh
        run: |
          $cmds = '{"id":1,"cmd":"ping"}', '{"id":2,"cmd":"windows"}', '{"id":3,"cmd":"nowPlaying"}', '{"id":4,"cmd":"getVolume"}', '{"id":5,"cmd":"nope"}'
          $out = ($cmds -join "`n") | powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/helper.ps1 2>&1 | Out-String
          Write-Host $out
          $msg = ($out -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
          if ($out -notmatch '"id":1' -or $out -notmatch '"id":5') { Write-Host "::error title=roundtrip::$msg"; exit 1 } else { Write-Host "::notice title=roundtrip::$msg" }
